name: Build Sound Box APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="sound-box-utility.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          rm -rf android-project
          mkdir android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "=== Extracted project ==="
          find android-project -maxdepth 2 -type f -print

          if [ ! -f "android-project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction."
            exit 1
          fi

      - name: Create debug keystore
        working-directory: android-project
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Check APK
        working-directory: android-project
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sound-box-utility-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
